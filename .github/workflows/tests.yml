name: tests
on: [push, pull_request]
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      # Same command as the merge gate: every test file except the Lean end-to-end tests (no Lean here).
      - run: uv run pytest -q tests/ --ignore=tests/test_lean.py
